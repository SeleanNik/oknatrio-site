# Apache: виртуальный хост сайта «Трио». Работает рядом с CRM: запросы выбираются по имени домена.
# Положить в /etc/apache2/sites-available/trio.selean.site.conf (Debian/Ubuntu), путь к сайту поправить под сервер.
#   sudo a2enmod rewrite headers expires deflate ssl
#   sudo a2ensite trio.selean.site && sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d trio.selean.site        # HTTPS (Let's Encrypt), после того как DNS и проброс портов заработали

<VirtualHost *:80>
    ServerName trio.selean.site
    DocumentRoot /var/www/oknatrio-site

    <Directory /var/www/oknatrio-site>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html index.php
    </Directory>

    # служебные папки закрыты (дополнительно к .htaccess внутри них)
    <DirectoryMatch "^/var/www/oknatrio-site/(admin/(inc|_data)|tools)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/trio-error.log
    CustomLog ${APACHE_LOG_DIR}/trio-access.log combined
</VirtualHost>

# После выпуска сертификата certbot сам создаст блок *:443 и редирект с http на https.
# Права: владелец www-data, на запись только data/, uploads/, docs/files/, admin/_data/
#   sudo chown -R www-data:www-data /var/www/oknatrio-site/{data,uploads,docs/files,admin/_data}
#   sudo chmod -R u+rwX /var/www/oknatrio-site/{data,uploads,docs/files,admin/_data}
# Файл form-config.php (адрес для заявок) создать на сервере из form-config.example.php.
